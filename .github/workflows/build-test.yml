name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check server syntax
      run: node -c server.js
    
    - name: Run tests
      run: npm test
    
    - name: Verify all HTML files
      run: |
        for file in public/*.html; do
          echo "Checking $file"
          grep -q "config.js" "$file" || echo "Warning: $file missing config.js"
        done

  # Optional: Add this job for Heroku deployment
  # Requires HEROKU_API_KEY secret to be set in GitHub repository settings
  deploy-heroku:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Heroku
      if: secrets.HEROKU_API_KEY != ''
      uses: AkhileshNS/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: "hookah-store"
        heroku_email: ${{ secrets.HEROKU_EMAIL }}
        usedocker: false
      continue-on-error: true
